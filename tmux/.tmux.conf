# default shell
set-option -g default-shell /usr/bin/zsh

#colours
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:RGB"
# Status bar
set -g status-style bg="#24273a",fg="#cdd6f4"
set -g status-left "#[bg=#b4befe,fg=#11111b,bold] #S #[bg=#24273a,fg=#b4befe] "
set -g status-right ""
# Window tabs
set -g window-status-style bg="#45475a",fg="#cdd6f4"
set -g window-status-format " #I:#W "
set -g window-status-current-style bg="#cba6f7",fg="#11111b",bold
set -g window-status-current-format " #I:#W "
# Pane borders
set -g pane-border-style fg="#313244"
set -g pane-active-border-style fg="#cba6f7"
# Command prompt styles
set -g message-style bg="#1e1e2e",fg="#cba6f7",bold
set -g message-command-style bg="#1e1e2e",fg="#f5c2e7"
# Session selector and copy mode styling
set -g mode-style bg="#f5c2e7",fg="#11111b",bold

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# mouse
set -g mouse on

# windows and panes numbers
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-position top

# delay after escape
set -s escape-time 0

# max shown session name length
set -g status-left-length 50

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind c new-window -c "#{pane_current_path}"

bind-key -r f run-shell "tmux new-window \"TERM=tmux-256color zsh ~/.local/scripts/tmux-sessions.sh $WORKSPACE_DIR $HOME\""
